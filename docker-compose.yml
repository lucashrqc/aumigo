services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aumor
      POSTGRES_PASSWORD: aumor
      POSTGRES_DB: aumor
    ports:
      - '5432:5432'
    volumes:
      - aumor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aumor -d aumor']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aumor:aumor@db:5432/aumor?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me}
      BETTER_AUTH_URL: http://localhost:3000
      NUXT_PUBLIC_AUTH_BASE_URL: http://localhost:3000
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

volumes:
  aumor_pgdata:
