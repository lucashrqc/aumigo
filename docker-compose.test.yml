services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aumor_test
      POSTGRES_PASSWORD: aumor_test
      POSTGRES_DB: aumor_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aumor_test -d aumor_test']
      interval: 3s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
